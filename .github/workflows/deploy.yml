# =============================================================================
# Pipeline de publicação em produção
#
#   Pull Request para a main -> Build            (valida e gera o artefato; vira check do PR)
#   Push na main (merge)     -> Build -> Deploy  (publica o artefato no Netlify)
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   NETLIFY_AUTH_TOKEN  personal access token do Netlify
#   NETLIFY_SITE_ID     Project ID do projeto no Netlify
#
# Local deste arquivo no repositório: .github/workflows/deploy.yml
# =============================================================================

name: Pipeline de Produção

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilégio: o token automático do GitHub só pode ler o repositório
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # CI: transforma o código do repositório em um artefato validado
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      # Num sistema real: testes unitários, lint, análise de segurança...
      - name: Validar o sistema
        run: |
          test -s index.html || { echo "::error::index.html ausente ou vazio"; exit 1; }
          grep -qi "<title>" index.html || { echo "::error::index.html sem <title>"; exit 1; }
          echo "Validação OK"

      # Num sistema real: mvn package, flutter build, docker build...
      - name: Gerar artefato
        run: |
          mkdir -p dist
          cp index.html dist/
          sed -i "s/__COMMIT__/${GITHUB_SHA::7}/g; s/__BUILD__/${GITHUB_RUN_NUMBER}/g" dist/index.html
          ls -la dist

      - name: Guardar artefato
        uses: actions/upload-artifact@v6
        with:
          name: sistema
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # CD: publica em produção exatamente o artefato que o build gerou
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: build
    # PR roda só o build; produção só recebe o que entrou na main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Dois merges seguidos não publicam ao mesmo tempo: o mais novo espera
    concurrency:
      group: producao
      cancel-in-progress: false
    environment:
      name: producao
      url: ${{ steps.publicar.outputs.url }}
    steps:
      - name: Baixar artefato do build
        uses: actions/download-artifact@v7
        with:
          name: sistema
          path: dist

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Versão fixa: o mesmo pipeline produz o mesmo resultado amanhã
      - name: Instalar Netlify CLI
        run: npm install -g netlify-cli@23.12.3

      - name: Publicar no Netlify
        id: publicar
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Secrets NETLIFY_AUTH_TOKEN e/ou NETLIFY_SITE_ID não configurados"
            exit 1
          fi

          netlify deploy \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --dir=dist \
            --prod \
            --no-build \
            --json \
            --message="Build #${GITHUB_RUN_NUMBER} - commit ${GITHUB_SHA::7}" > deploy.json

          cat deploy.json
          echo "url=$(jq -r '.url // empty' deploy.json)" >> "$GITHUB_OUTPUT"
          echo "logs=$(jq -r '.logs // empty' deploy.json)" >> "$GITHUB_OUTPUT"

      # Registro da execução: aparece no resumo do run na aba Actions
      - name: Registrar execução
        if: always()
        env:
          STATUS: ${{ job.status }}
          URL: ${{ steps.publicar.outputs.url }}
          LOGS: ${{ steps.publicar.outputs.logs }}
        run: |
          {
            echo "### Deploy em produção"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Status | ${STATUS} |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Autor do push | @${GITHUB_ACTOR} |"
            echo "| Build | #${GITHUB_RUN_NUMBER} |"
            echo "| URL | ${URL:-não disponível} |"
            echo "| Log no Netlify | ${LOGS:-não disponível} |"
          } >> "$GITHUB_STEP_SUMMARY"
